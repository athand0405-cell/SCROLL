    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
    .hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:12px}.brand{font:700 28px "Space Grotesk";letter-spacing:-1.7px}.brand span{color:var(--purple)}.topbar{height:68px;position:fixed;inset:0 0 auto;z-index:20;background:var(--nav);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top-left,.top-actions{display:flex;align-items:center;gap:18px}.status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#f59e0b}.dot.online{background:#22c55e}.icon-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);display:grid;place-items:center;font-size:17px}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--purple),var(--blue));display:grid;place-items:center;color:white;font-weight:800;border:1px solid #ffffff22}.layout{max-width:1440px;margin:0 auto;padding:92px 24px 40px;display:grid;grid-template-columns:220px minmax(0,1fr) 270px;gap:28px}.sidebar{position:sticky;top:92px;height:calc(100vh - 115px);display:flex;flex-direction:column;gap:7px}.nav-item{display:flex;align-items:center;gap:14px;padding:13px 15px;border-radius:14px;color:var(--muted);font-weight:600;transition:.2s;border:0;background:transparent;text-align:left}.nav-item:hover,.nav-item.active{background:var(--panel2);color:var(--text)}.nav-item.active .nav-icon{color:var(--purple)}.nav-icon{width:22px;text-align:center;font-size:19px}.create-nav{margin-top:8px;background:linear-gradient(110deg,var(--purple),#6256df);color:white;justify-content:center;box-shadow:0 8px 26px #8b5cf633}.create-nav:hover{color:white;filter:brightness(1.08)}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}.main{min-width:0;max-width:760px;width:100%;margin:0 auto}.rightbar{position:sticky;top:92px;height:fit-content;display:flex;flex-direction:column;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}.panel-title{font:700 14px "Space Grotesk";margin:0 0 14px}.feed-tabs{display:flex;gap:7px;overflow:auto;padding:3px 0 17px;border-bottom:1px solid var(--line);margin-bottom:17px}.tab{border:0;background:transparent;color:var(--muted);padding:9px 15px;border-radius:12px;font-weight:700;white-space:nowrap}.tab.active{background:var(--panel2);color:var(--text)}.tab.active:after{content:"";display:block;height:2px;background:var(--purple);margin:7px auto -9px;width:18px;border-radius:4px}

    .searchbox{width:100%;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:12px 14px;border-radius:13px;outline:none}.searchbox:focus,.field:focus{border-color:var(--purple);box-shadow:0 0 0 3px #8b5cf622}.suggestion{display:flex;align-items:center;gap:10px;padding:9px 0}.suggestion .avatar{width:34px;height:34px}.suggestion-info{flex:1;min-width:0}.suggestion-info b{display:block;font-size:13px}.suggestion-info span{font-size:11px;color:var(--muted)}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--muted);font-size:11px}.tag-cloud{display:flex;flex-wrap:wrap;gap:7px}.tag{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:7px 10px;font-size:12px}
    .page-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 18px}.page-head h1{font:700 25px "Space Grotesk";margin:0}.btn{border:0;background:linear-gradient(110deg,var(--purple),#6256df);color:white;padding:11px 16px;border-radius:12px;font-weight:800}.btn.secondary{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.btn.danger{background:#be3456}.btn:disabled{opacity:.5;cursor:not-allowed}.field{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px 13px;outline:none;margin:6px 0 12px}.field-label{font-size:12px;color:var(--muted);font-weight:700}.textarea{min-height:100px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.upload-drop{border:1px dashed var(--line);background:var(--panel2);border-radius:17px;padding:26px;text-align:center}.upload-drop input{max-width:100%;margin-top:12px}.progress{height:6px;background:var(--panel2);border-radius:20px;overflow:hidden;margin:12px 0}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--blue));transition:width .2s}
    .profile-head{padding:25px;border-radius:22px;background:var(--panel);border:1px solid var(--line)}.profile-cover{height:130px;border-radius:15px;background:linear-gradient(120deg,#30205c,#173b68,#171717);margin:-8px -8px 0}.profile-main{display:flex;align-items:flex-end;gap:15px;margin-top:-35px;padding:0 10px}.profile-main .avatar{width:82px;height:82px;border:4px solid var(--panel);font-size:24px}.profile-stats{display:flex;gap:25px;margin:17px 0}.profile-stats b{display:block;font-size:17px}.profile-stats span{font-size:12px;color:var(--muted)}.video-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:17px}.grid-video{aspect-ratio:9/13;background:var(--panel2);border-radius:13px;overflow:hidden;position:relative}.grid-video video{width:100%;height:100%;object-fit:cover}.grid-video .views{position:absolute;bottom:8px;left:9px;color:white;font-size:11px;text-shadow:0 1px 4px #000}
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(ellipse at 50% 0%,#4c2c8a33,transparent 50%),var(--bg)}.auth-card{width:min(100%,440px);padding:34px;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.auth-card .brand{font-size:34px}.auth-card h1{font:700 25px "Space Grotesk";margin:27px 0 7px}.auth-card .muted{font-size:13px;line-height:1.6}.auth-foot{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}.link-btn{background:none;border:0;color:#a78bfa;font-weight:800}.toast{position:fixed;z-index:80;bottom:25px;left:50%;transform:translateX(-50%);background:#222;color:#fff;border:1px solid #444;border-radius:12px;padding:12px 17px;box-shadow:var(--shadow);font-size:13px;max-width:90vw}.modal-backdrop{position:fixed;inset:0;background:#0009;z-index:60;display:grid;place-items:center;padding:16px}.modal{width:min(100%,560px);max-height:85vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal-head h2{font:700 19px "Space Grotesk";margin:0}.comment{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.comment b{margin-right:6px}.comment small{color:var(--muted)}.mobile-nav{display:none}
    @media(max-width:1100px){.layout{grid-template-columns:190px minmax(0,1fr);max-width:1000px}.rightbar{display:none}.main{max-width:720px}}
    @media(max-width:700px){.topbar{height:58px;padding:0 15px}.brand{font-size:25px}.status{display:none}.layout{display:block;padding:74px 10px 88px}.sidebar{display:none}.main{max-width:100%}.feed-tabs{margin-bottom:12px;padding-bottom:12px}.video-card{height:calc(100svh - 160px);min-height:480px;max-height:760px;border-radius:18px;margin-bottom:14px}.video-info{left:15px;right:75px;bottom:17px}.video-actions{right:10px;bottom:18px;gap:13px}.action .bubble{width:42px;height:42px}.mobile-nav{display:flex;position:fixed;z-index:30;inset:auto 0 0;height:67px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--nav);backdrop-filter:blur(18px);border-top:1px solid var(--line);justify-content:space-around}.mobile-nav button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;min-width:48px}.mobile-nav button span:first-child{font-size:21px}.mobile-nav button.active{color:var(--purple)}.mobile-nav .mobile-create{color:white;background:linear-gradient(120deg,var(--purple),var(--blue));border-radius:14px;width:45px;height:42px;align-self:center;font-size:22px}.top-actions{gap:8px}.icon-btn{width:36px;height:36px}.form-grid{grid-template-columns:1fr}.profile-stats{gap:15px}.video-grid{gap:6px}.page-head h1{font-size:22px}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}}

<body>
  <div id="app"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="modal-root"></div>
  <script>
  (() => {
    "use strict";
    const CONFIG = {
      SUPABASE_URL: "https://YOUR-PROJECT.supabase.co",
      SUPABASE_ANON_KEY: "YOUR_SUPABASE_ANON_KEY"
    };
    const $ = (s,root=document)=>root.querySelector(s);
    const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const initials = s => (s||"S").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();
    let db=null, user=null, profile=null, currentPage="home", feedTab="for_you", feedRows=[], observer=null, activeVideo=null, uploadFile=null, theme="dark";
    const configured = !CONFIG.SUPABASE_URL.includes("https://vbtxdouiuctnhucqqvhc.supabase.co") && !CONFIG.SUPABASE_ANON_KEY.includes("sb_publishable_tE-E2M0jnVFHskin7Ycteg_CytN4Tb3");
    const toast = msg => {const el=$("#toast");el.textContent=msg;el.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.add("hidden"),3200)};
    const avatar = (url,name,cls="avatar") => url ? `<img class="${cls}" src="${esc(url)}" alt="" loading="lazy">` : `<div class="${cls}">${esc(initials(name))}</div>`;
    const fmt = n => Intl.NumberFormat("id-ID",{notation:n>9999?"compact":"standard",maximumFractionDigits:1}).format(n||0);
    const go = page => {currentPage=page;renderPage();document.querySelectorAll(".nav-item,.mobile-nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));};
    const navItems=[["home","⌂","Home"],["explore","⌕","Explore"],["following","◎","Following"],["create","＋","Create"],["messages","✉","Messages"],["notifications","♧","Notifications"],["profile","◉","Profile"],["settings","⚙","Settings"]];
    function shell(){return `<header class="topbar"><div class="top-left"><div class="brand">SCROLL<span>.</span></div><div class="status"><i class="dot ${configured?"online":""}"></i>${configured?"Backend configured":"Backend not configured"}</div></div><div class="top-actions"><button class="icon-btn" id="themeBtn" title="Change theme">◐</button><button class="icon-btn" id="topSearch" title="Search">⌕</button>${avatar(profile?.avatar_url,profile?.display_name||profile?.username)} </div></header><div class="layout"><aside class="sidebar">${navItems.map(([id,ic,label])=>`<button class="nav-item ${id==="home"?"active":""} ${id==="create"?"create-nav":""}" data-page="${id}"><span class="nav-icon">${ic}</span>${label}</button>`).join("")}<div class="sidebar-bottom"><button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button><button class="nav-item" id="signOut"><span class="nav-icon">↪</span>Sign out</button><p class="small muted" style="padding:8px 15px">SCROLL © 2026<br>Your World. Your Moments. Your Scroll.</p></div></aside><main class="main" id="main"></main><aside class="rightbar"><div class="panel"><h3 class="panel-title">Discover something new</h3><input id="sideSearch" class="searchbox" placeholder="Search creators, videos, tags..." /><p class="small muted">Find people and ideas worth your time.</p></div><div class="panel"><h3 class="panel-title">Popular topics</h3><div class="tag-cloud">${["#fyp","#creative","#learnontiktok","#gaming","#dailyvlog","#technology"].map(t=>`<button class="tag" data-tag="${t}">${t}</button>`).join("")}</div></div><div class="panel"><h3 class="panel-title">A better kind of scroll.</h3><p class="small muted">Discover, create, and connect. Keep your community kind and safe.</p><button class="btn secondary" style="width:100%" data-page="settings">Explore settings</button></div></aside></div><nav class="mobile-nav">${[["home","⌂","Home"],["explore","⌕","Explore"],["create","＋","Create"],["notifications","♧","Inbox"],["profile","◉","Profile"]].map(([id,ic,l])=>`<button data-page="${id}" class="${id==="home"?"active":""} ${id==="create"?"mobile-create":""}"><span>${ic}</span>${id==="create"?"":l}</button>`).join("")}</nav>`}
    function authScreen(mode="login"){return `<div class="auth-wrap"><section class="auth-card"><div class="brand">SCROLL<span>.</span></div><h1>${mode==="login"?"Welcome back.":"Join the movement."}</h1><p class="muted">${mode==="login"?"Your world is waiting. Sign in to continue your scroll.":"Create your space, find your people, and share what moves you."}</p><form id="authForm">${mode==="signup"?`<label class="field-label">Full name</label><input class="field" name="full_name" required maxlength="70" placeholder="Your full name"><label class="field-label">Username</label><input class="field" name="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_.]+" placeholder="yourusername"><label class="field-label">Date of birth</label><input class="field" name="dob" type="date" required max="${new Date().toISOString().slice(0,10)}">`:""}<label class="field-label">Email</label><input class="field" name="email" type="email" required autocomplete="email" placeholder="you@example.com"><label class="field-label">Password</label><input class="field" name="password" type="password" required minlength="8" autocomplete="${mode==="login"?"current-password":"new-password"}" placeholder="At least 8 characters">${mode==="signup"?`<label style="display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--muted);margin:3px 0 14px"><input type="checkbox" name="terms" required style="margin-top:2px"> I agree to the Terms of Service and Community Guidelines.</label>`:""}<button class="btn" style="width:100%" type="submit">${mode==="login"?"Sign in":"Create account"}</button><p id="authError" class="small" style="color:var(--danger)"></p></form><div class="auth-foot">${mode==="login"?'New to SCROLL? <button class="link-btn" id="switchAuth">Create account</button>': 'Already have an account? <button class="link-btn" id="switchAuth">Sign in</button>'}<br><br><span>By continuing, you agree to use SCROLL respectfully.</span></div></section></div>`}
    function bindAuth(mode){$("#switchAuth")?.addEventListener("click",()=>{ $("#app").innerHTML=authScreen(mode==="login"?"signup":"login");bindAuth(mode==="login"?"signup":"login")});$("#authForm")?.addEventListener("submit",async e=>{e.preventDefault();if(!db)return;const f=new FormData(e.currentTarget),btn=e.currentTarget.querySelector("button[type=submit]");btn.disabled=true;btn.textContent="Please wait…";try{if(mode==="login"){const {error}=await db.auth.signInWithPassword({email:f.get("email"),password:f.get("password")});if(error)throw error}else{const dob=f.get("dob"),age=(Date.now()-new Date(dob).getTime())/31557600000;if(age<13)throw Error("SCROLL is not available for users under 13.");if(age>120||!dob)throw Error("Please enter a valid date of birth.");const username=String(f.get("username")).toLowerCase();const {data,error}=await db.auth.signUp({email:f.get("email"),password:f.get("password"),options:{data:{username,display_name:f.get("full_name"),date_of_birth:dob}}});if(error)throw error;if(!data.session){toast("Check your email to verify your account.");$("#authError").textContent="Verification email sent. Confirm your email, then sign in.";return}}}catch(err){$("#authError").textContent=err.message||"Something went wrong."}finally{btn.disabled=false;btn.textContent=mode==="login"?"Sign in":"Create account"}})}
    async function init(){if(!configured||!window.supabase){$("#app").innerHTML=authScreen();$("#authError").textContent="Add your Supabase project URL and anon key in CONFIG to connect SCROLL.";return}db=window.supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY,{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:true}});const {data}=await db.auth.getSession();user=data.session?.user||null;if(user)await loadProfile();render();db.auth.onAuthStateChange(async(_event,session)=>{user=session?.user||null;if(user){await loadProfile();render()}else{profile=null;$("#app").innerHTML=authScreen();bindAuth("login")}})}
    async function loadProfile(){if(!user)return;const {data,error}=await db.from("profiles").select("*").eq("id",user.id).maybeSingle();if(error)console.warn(error);profile=data||{id:user.id,username:user.user_metadata?.username||"new_user",display_name:user.user_metadata?.display_name||"New creator"}}
    function render(){if(!user){$("#app").innerHTML=authScreen();bindAuth("login");return}$("#app").innerHTML=shell();bindShell();renderPage()}
    function bindShell(){document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));$("#signOut")?.addEventListener("click",async()=>{await db.auth.signOut();toast("Signed out")});$("#themeBtn")?.addEventListener("click",()=>{theme=theme==="dark"?"light":"dark";document.documentElement.dataset.theme=theme});$("#topSearch")?.addEventListener("click",()=>go("explore"));$("#sideSearch")?.addEventListener("keydown",e=>{if(e.key==="Enter"){go("explore");setTimeout(()=>{const q=$("#searchInput");if(q){q.value=e.target.value;searchNow(e.target.value)}},50)}});document.querySelectorAll("[data-tag]").forEach(b=>b.addEventListener("click",()=>{go("explore");setTimeout(()=>{const q=$("#searchInput");if(q){q.value=b.dataset.tag;searchNow(q.value)}},50)}))}
    async function renderPage(){if(!user)return;const main=$("#main");if(!main)return; if(observer){observer.disconnect();observer=null}activeVideo=null;main.innerHTML='<div class="skeleton"></div>';try{if(currentPage==="home"||currentPage==="following")await renderFeed(main);else if(currentPage==="create")renderCreate(main);else if(currentPage==="profile")await renderProfile(main,user.id);else if(currentPage==="explore")renderExplore(main);else if(currentPage==="settings")renderSettings(main);else if(currentPage==="notifications")await renderNotifications(main);else if(currentPage==="messages")renderMessages(main);else renderFeed(main)}catch(e){main.innerHTML=`<div class="empty"><strong>Could not load this page</strong>${esc(e.message)}<br><button class="btn secondary" id="retry" style="margin-top:15px">Try again</button></div>`;$("#retry")?.addEventListener("click",renderPage)}}
    async function renderFeed(main){main.innerHTML=`<div class="feed-tabs">${[["for_you","For You"],["following","Following"],["trending","Trending"],["fresh","Fresh"]].map(([v,l])=>`<button class="tab ${feedTab===v?"active":""}" data-feed="${v}">${l}</button>`).join("")}</div><div id="feedList"><div class="skeleton"></div></div>`;main.querySelectorAll("[data-feed]").forEach(b=>b.addEventListener("click",()=>{feedTab=b.dataset.feed;renderFeed(main)}));let q=db.from("videos").select("id,user_id,caption,video_path,thumbnail_path,created_at,like_count,comment_count,view_count,profiles(username,display_name,avatar_url)").eq("visibility","public").eq("status","published").order("created_at",{ascending:false}).limit(12);if(currentPage==="following"||feedTab==="following"){const {data:follows}=await db.from("follows").select("following_id").eq("follower_id",user.id);const ids=(follows||[]).map(x=>x.following_id);if(!ids.length){$("#feedList").innerHTML='<div class="empty"><strong>Your following feed is quiet.</strong>Follow creators to see their new videos here.</div>';return}q=q.in("user_id",ids)}else if(feedTab==="trending")q=q.order("like_count",{ascending:false});const {data,error}=await q;if(error)throw error;feedRows=data||[];if(!feedRows.length){$("#feedList").innerHTML='<div class="empty"><strong>Your feed starts here.</strong>There are no public videos yet. Be the first to share a moment.<br><button class="btn" style="margin-top:15px" id="firstCreate">Create a video</button></div>';$("#firstCreate")?.addEventListener("click",()=>go("create"));return}$("#feedList").innerHTML=(await Promise.all(feedRows.map(videoCard))).join("");bindVideoCards()}
    async function videoCard(v){const p=v.profiles||{};const src=await mediaUrl(v.video_path);const poster=v.thumbnail_path?await mediaUrl(v.thumbnail_path):"";return `<article class="video-card" data-video="${v.id}"><video src="${esc(src)}" ${poster?`poster="${esc(poster)}"`:""} playsinline muted loop preload="metadata"></video><div class="video-shade"></div><div class="video-info"><div class="creator-line">${avatar(p.avatar_url,p.display_name||p.username)}<div><div class="creator-name">@${esc(p.username||"creator")}</div><div class="small">${esc(p.display_name||"SCROLL creator")}</div></div>${v.user_id!==user.id?`<button class="follow-mini" data-follow="${v.user_id}">＋ Follow</button>`:""}</div><p class="caption">${esc(v.caption||"")}</p><div class="audio-line">♫ Original audio · SCROLL</div></div><div class="video-actions"><button class="action" data-like="${v.id}"><span class="bubble">♡</span><span>${fmt(v.like_count)}</span></button><button class="action" data-comments="${v.id}"><span class="bubble">▢</span><span>${fmt(v.comment_count)}</span></button><button class="action" data-bookmark="${v.id}"><span class="bubble">⌑</span><span>Save</span></button><button class="action" data-share="${v.id}"><span class="bubble">↗</span><span>Share</span></button></div></article>`}
    async function mediaUrl(path){if(!path)return "";const {data,error}=await db.storage.from("videos").createSignedUrl(path,3600);if(error){console.warn("Media access:",error.message);return ""}return data.signedUrl}
    function bindVideoCards(){const cards=[...document.querySelectorAll(".video-card")];observer=new IntersectionObserver(entries=>entries.forEach(entry=>{const v=entry.target.querySelector("video");if(entry.isIntersecting&&entry.intersectionRatio>.65){cards.forEach(c=>{const el=c.querySelector("video");if(c!==entry.target)el.pause()});activeVideo=v;v.play().catch(()=>{})}else v.pause()}),{threshold:[.2,.65]});cards.forEach(c=>observer.observe(c));cards.forEach(c=>{const v=c.querySelector("video");v.addEventListener("click",()=>v.paused?v.play():v.pause())});document.querySelectorAll("[data-like]").forEach(b=>b.addEventListener("click",()=>toggleLike(b.dataset.like,b)));document.querySelectorAll("[data-comments]").forEach(b=>b.addEventListener("click",()=>openComments(b.dataset.comments)));document.querySelectorAll("[data-bookmark]").forEach(b=>b.addEventListener("click",()=>toggleBookmark(b.dataset.bookmark,b)));document.querySelectorAll("[data-follow]").forEach(b=>b.addEventListener("click",()=>toggleFollow(b.dataset.follow,b)));document.querySelectorAll("[data-share]").forEach(b=>b.addEventListener("click",()=>shareVideo(b.dataset.share)))}
    async function toggleLike(id,btn){const {data:existing,error:e}=await db.from("likes").select("video_id").eq("video_id",id).eq("user_id",user.id).maybeSingle();if(e){toast(e.message);return}if(existing){const {error}=await db.from("likes").delete().eq("video_id",id).eq("user_id",user.id);if(error){toast(error.message);return}btn.classList.remove("liked");btn.querySelector(".bubble").textContent="♡"}else{const {error}=await db.from("likes").insert({video_id:id,user_id:user.id});if(error){toast(error.message);return}btn.classList.add("liked");btn.querySelector(".bubble").textContent="♥"}const count=btn.querySelector("span:last-child");count.textContent=fmt(Math.max(0,(Number(count.textContent.replace(/\D/g,""))||0)+(existing?-1:1)));}
    async function toggleBookmark(id,btn){const {data}=await db.from("bookmarks").select("video_id").eq("video_id",id).eq("user_id",user.id).maybeSingle();if(data){const {error}=await db.from("bookmarks").delete().eq("video_id",id).eq("user_id",user.id);if(error)return toast(error.message);btn.classList.remove("saved");btn.querySelector(".bubble").textContent="⌑";toast("Removed from saved")}else{const {error}=await db.from("bookmarks").insert({video_id:id,user_id:user.id});if(error)return toast(error.message);btn.classList.add("saved");btn.querySelector(".bubble").textContent="▣";toast("Saved privately")}}
    async function toggleFollow(id,btn){const {data}=await db.from("follows").select("following_id").eq("follower_id",user.id).eq("following_id",id).maybeSingle();if(data){const {error}=await db.from("follows").delete().eq("follower_id",user.id).eq("following_id",id);if(error)return toast(error.message);btn.textContent="＋ Follow"}else{const {error}=await db.from("follows").insert({follower_id:user.id,following_id:id});if(error)return toast(error.message);btn.textContent="Following"}}
    async function shareVideo(id){const url=location.origin+location.pathname+"?video="+encodeURIComponent(id);try{if(navigator.share)await navigator.share({title:"SCROLL video",url});else{await navigator.clipboard.writeText(url);toast("Video link copied")}}catch(e){if(e.name!=="AbortError")toast("Unable to share this link")}}
    async function openComments(id){const root=$("#modal-root");root.innerHTML=`<div class="modal-backdrop"><section class="modal"><div class="modal-head"><h2>Comments</h2><button class="icon-btn" id="closeModal">×</button></div><div id="commentList" class="muted small">Loading comments…</div><form id="commentForm" style="display:flex;gap:8px;margin-top:15px"><input class="field" name="body" maxlength="1000" required placeholder="Add a thoughtful comment…" style="margin:0"><button class="btn">Send</button></form></section></div>`;$("#closeModal").onclick=()=>root.innerHTML="";const load=async()=>{const {data,error}=await db.from("comments").select("id,body,created_at,user_id,profiles(username,display_name)").eq("video_id",id).is("parent_id",null).order("created_at",{ascending:false}).limit(50);if(error){$("#commentList").textContent=error.message;return}$("#commentList").innerHTML=data.length?data.map(c=>`<div class="comment"><b>@${esc(c.profiles?.username||"user")}</b>${esc(c.body)}<br><small>${new Date(c.created_at).toLocaleString("id-ID")}</small></div>`).join(""):'No comments yet. Start the conversation.'};await load();$("#commentForm").onsubmit=async e=>{e.preventDefault();const body=new FormData(e.currentTarget).get("body").trim();if(!body)return;const {error}=await db.from("comments").insert({video_id:id,user_id:user.id,body});if(error){toast(error.message);return}e.currentTarget.reset();await load()}}
    function renderCreate(main){main.innerHTML=`<div class="page-head"><h1>Create</h1><span class="pill">Video Studio</span></div><section class="panel"><h3 class="panel-title">Share a moment</h3><p class="small muted">Upload a video you own or have permission to share. Supported: MP4, MOV, WebM. Maximum 100 MB in this starter setup.</p><form id="uploadForm"><div class="upload-drop"><div style="font-size:30px">↥</div><b>Choose a video</b><p class="small muted">Vertical videos look best on SCROLL.</p><input id="videoFile" type="file" accept="video/mp4,video/quicktime,video/webm" required></div><div id="previewWrap" class="hidden" style="margin-top:14px"><video id="uploadPreview" controls playsinline style="width:100%;max-height:340px;border-radius:14px;background:#000"></video></div><label class="field-label">Caption</label><textarea class="field textarea" name="caption" maxlength="2200" placeholder="What is happening in this moment?"></textarea><div class="form-grid"><div><label class="field-label">Audience</label><select class="field" name="visibility"><option value="public">Public</option><option value="followers">Followers only</option><option value="private">Only me</option></select></div><div><label class="field-label">Comments</label><select class="field" name="comments_enabled"><option value="true">Allow comments</option><option value="false">Turn off comments</option></select></div></div><label style="display:flex;gap:9px;align-items:center;font-size:12px;color:var(--muted);margin:4px 0 12px"><input type="checkbox" name="rights" required>I confirm I have the rights to upload this content.</label><div class="progress"><span id="uploadProgress"></span></div><button class="btn" id="uploadBtn" type="submit" style="width:100%">Publish video</button><p id="uploadStatus" class="small muted"></p></form></section>`;$("#videoFile").onchange=e=>{uploadFile=e.target.files[0];if(!uploadFile)return;if(uploadFile.size>100*1024*1024){toast("File is larger than 100 MB.");e.target.value="";uploadFile=null;return}const url=URL.createObjectURL(uploadFile);$("#uploadPreview").src=url;$("#previewWrap").classList.remove("hidden")};$("#uploadForm").onsubmit=async e=>{e.preventDefault();if(!uploadFile)return toast("Choose a video first.");const btn=$("#uploadBtn"),status=$("#uploadStatus");btn.disabled=true;status.textContent="Uploading video securely…";try{const ext=uploadFile.name.split(".").pop().toLowerCase();if(!["mp4","mov","webm"].includes(ext))throw Error("Unsupported file type.");const path=`${user.id}/${crypto.randomUUID()}.${ext}`;const {data:stored,error:storageError}=await db.storage.from("videos").upload(path,uploadFile,{contentType:uploadFile.type,upsert:false});if(storageError)throw storageError;$("#uploadProgress").style.width="100%";const f=new FormData(e.currentTarget);const {error}=await db.from("videos").insert({user_id:user.id,caption:f.get("caption"),video_path:stored.path,visibility:f.get("visibility"),comments_enabled:f.get("comments_enabled")==="true",status:"published"});if(error){await db.storage.from("videos").remove([path]);throw error}toast("Your video is live.");uploadFile=null;go("home")}catch(err){status.textContent=err.message||"Upload failed.";toast("Upload failed")}finally{btn.disabled=false}}}
    async function renderProfile(main,id){const own=id===user.id;const [{data:p},{count:followers},{count:following},{count:likes},{data:videos,error}]=await Promise.all([db.from("profiles").select("*").eq("id",id).maybeSingle(),db.from("follows").select("*",{count:"exact",head:true}).eq("following_id",id),db.from("follows").select("*",{count:"exact",head:true}).eq("follower_id",id),db.from("likes").select("video_id,videos!inner(user_id)",{count:"exact",head:true}).eq("videos.user_id",id),db.from("videos").select("id,video_path,view_count,caption").eq("user_id",id).eq("status","published").order("created_at",{ascending:false}).limit(30)]);if(error)throw error;if(!p){main.innerHTML='<div class="empty"><strong>Profile not found</strong>This profile may no longer be available.</div>';return}const {data:meFollow}=own?{data:null}:await db.from("follows").select("following_id").eq("follower_id",user.id).eq("following_id",id).maybeSingle();const videoTiles=await Promise.all((videos||[]).map(async v=>({v,url:await mediaUrl(v.video_path)})));main.innerHTML=`<div class="profile-head"><div class="profile-cover"></div><div class="profile-main">${avatar(p.avatar_url,p.display_name||p.username)}<div style="flex:1;padding-bottom:5px"><b style="font-size:18px">${esc(p.display_name||p.username)}</b><div class="small muted">@${esc(p.username)}</div></div>${own?'<button class="btn secondary" id="editProfile">Edit profile</button>':`<button class="btn" id="profileFollow">${meFollow?"Following":"Follow"}</button>`}</div><p class="small" style="margin:16px 10px 0">${esc(p.bio||"")}</p><div class="profile-stats"><div><b>${fmt(videos?.length||0)}</b><span>Videos</span></div><div><b>${fmt(followers||0)}</b><span>Followers</span></div><div><b>${fmt(following||0)}</b><span>Following</span></div><div><b>${fmt(likes||0)}</b><span>Likes</span></div></div></div><div class="page-head" style="margin-top:22px"><h1 style="font-size:18px">Videos</h1></div><div class="video-grid">${(videos||[]).map(v=>`<div class="grid-video"><video src="${esc(mediaUrl(v.video_path))}" muted playsinline preload="metadata"></video><span class="views">▶ ${fmt(v.view_count)}</span></div>`).join("")||'<div class="empty" style="grid-column:1/-1">No videos published yet.</div>'}</div>`;$("#profileFollow")?.addEventListener("click",async()=>{await toggleFollow(id,$("#profileFollow"))});$("#editProfile")?.addEventListener("click",()=>editProfile())}
    function editProfile(){const root=$("#modal-root");root.innerHTML=`<div class="modal-backdrop"><section class="modal"><div class="modal-head"><h2>Edit profile</h2><button class="icon-btn" id="closeModal">×</button></div><form id="profileForm"><label class="field-label">Display name</label><input class="field" name="display_name" maxlength="60" value="${esc(profile?.display_name||"")}"><label class="field-label">Username</label><input class="field" name="username" pattern="[A-Za-z0-9_.]+" minlength="3" maxlength="24" value="${esc(profile?.username||"")}"><label class="field-label">Bio</label><textarea class="field textarea" name="bio" maxlength="160">${esc(profile?.bio||"")}</textarea><label class="field-label">Avatar image URL (optional)</label><input class="field" name="avatar_url" type="url" value="${esc(profile?.avatar_url||"")}"><button class="btn" style="width:100%">Save changes</button></form></section></div>`;$("#closeModal").onclick=()=>root.innerHTML="";$("#profileForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),username=String(f.get("username")).toLowerCase();const patch={display_name:f.get("display_name"),username,bio:f.get("bio"),avatar_url:f.get("avatar_url")||null,updated_at:new Date().toISOString()};const {error}=await db.from("profiles").update(patch).eq("id",user.id);if(error)return toast(error.message);profile={...profile,...patch};root.innerHTML="";render();toast("Profile updated")}}
    function renderExplore(main){main.innerHTML=`<div class="page-head"><h1>Explore</h1></div><input id="searchInput" class="searchbox" placeholder="Search creators, captions, hashtags…"><div class="tag-cloud" style="margin:14px 0 20px">${["Entertainment","Education","Technology","Gaming","Music","Lifestyle","Art","Food","Travel","Sports","Comedy","Photography"].map(x=>`<button class="tag" data-exploretag="${x}">${x}</button>`).join("")}</div><div id="searchResults"><div class="empty"><strong>Find your next inspiration.</strong>Search for creators, videos, and topics.</div></div>`;let timer;$("#searchInput").addEventListener("input",e=>{clearTimeout(timer);timer=setTimeout(()=>searchNow(e.target.value),350)});main.querySelectorAll("[data-exploretag]").forEach(b=>b.onclick=()=>{const q=$("#searchInput");q.value=b.textContent;searchNow(q.value)})}
    async function searchNow(term){const box=$("#searchResults");if(!box)return;if(!term.trim()){box.innerHTML='<div class="empty"><strong>Find your next inspiration.</strong>Search for creators, videos, and topics.</div>';return}box.innerHTML='<div class="skeleton"></div>';const clean=term.replace(/[,%()]/g," ").trim();const [{data:profiles},{data:videos}] = await Promise.all([db.from("profiles").select("id,username,display_name,avatar_url").or(`username.ilike.%${clean}%,display_name.ilike.%${clean}%`).limit(8),db.from("videos").select("id,user_id,caption,video_path,like_count,comment_count,view_count,profiles(username,display_name,avatar_url)").eq("visibility","public").eq("status","published").ilike("caption",`%${clean}%`).limit(12)]);box.innerHTML=`<h3 class="panel-title">Creators</h3>${(profiles||[]).map(p=>`<div class="suggestion">${avatar(p.avatar_url,p.display_name)}<div class="suggestion-info"><b>${esc(p.display_name||p.username)}</b><span>@${esc(p.username)}</span></div><button class="btn secondary" data-openprofile="${p.id}">View</button></div>`).join("")||'<p class="small muted">No matching creators.</p>'}<h3 class="panel-title" style="margin-top:22px">Videos</h3>${(videos||[]).map(v=>`<div class="suggestion">${avatar(v.profiles?.avatar_url,v.profiles?.username)}<div class="suggestion-info"><b>@${esc(v.profiles?.username||"creator")}</b><span>${esc(v.caption||"Video")}</span></div><span class="pill">▶ ${fmt(v.view_count)}</span></div>`).join("")||'<p class="small muted">No matching public videos.</p>'}`;box.querySelectorAll("[data-openprofile]").forEach(b=>b.onclick=()=>renderProfile($("#main"),b.dataset.openprofile))}
    function renderSettings(main){main.innerHTML=`<div class="page-head"><h1>Settings</h1></div><section class="panel"><h3 class="panel-title">Account</h3><p class="small muted">Signed in as ${esc(user.email)}</p><button class="btn secondary" id="resetPassword">Send password reset email</button></section><section class="panel" style="margin-top:14px"><h3 class="panel-title">Privacy & safety</h3><p class="small muted">Your content visibility is selected per upload. Private collections and saved videos are only visible to you.</p><button class="btn secondary" id="downloadData">Export basic profile data</button></section><section class="panel" style="margin-top:14px"><h3 class="panel-title">Appearance</h3><p class="small muted">Choose a theme for this session.</p><button class="btn secondary" id="themeSetting">Switch to ${theme==="dark"?"light":"dark"} mode</button></section><section class="panel" style="margin-top:14px"><h3 class="panel-title">Session</h3><button class="btn danger" id="settingsSignOut">Sign out</button></section>`;$("#resetPassword").onclick=async()=>{const {error}=await db.auth.resetPasswordForEmail(user.email,{redirectTo:location.href});toast(error?.message||"Password reset email sent.")};$("#themeSetting").onclick=()=>{theme=theme==="dark"?"light":"dark";document.documentElement.dataset.theme=theme;renderPage()};$("#settingsSignOut").onclick=()=>db.auth.signOut();$("#downloadData").onclick=()=>{const blob=new Blob([JSON.stringify({profile,email:user.email},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="scroll-profile-export.json";a.click();URL.revokeObjectURL(a.href)}}
    async function renderNotifications(main){const {data,error}=await db.from("notifications").select("id,type,actor_id,video_id,body,is_read,created_at").eq("user_id",user.id).order("created_at",{ascending:false}).limit(40);if(error)throw error;main.innerHTML=`<div class="page-head"><h1>Notifications</h1><button class="btn secondary" id="readAll">Mark all read</button></div>${(data||[]).map(n=>`<div class="panel" style="margin-bottom:9px;display:flex;gap:12px;align-items:center;opacity:${n.is_read?'.65':'1'}"><div class="avatar">♧</div><div style="flex:1"><b style="font-size:13px">${esc(n.body||n.type)}</b><div class="small muted">${new Date(n.created_at).toLocaleString("id-ID")}</div></div>${!n.is_read?'<span class="dot online"></span>':""}</div>`).join("")||'<div class="empty"><strong>All caught up.</strong>New activity will appear here.</div>'}`;$("#readAll").onclick=async()=>{const {error}=await db.from("notifications").update({is_read:true}).eq("user_id",user.id);if(error)toast(error.message);else renderNotifications(main)}}
    function renderMessages(main){main.innerHTML=`<div class="page-head"><h1>Messages</h1></div><div class="empty"><strong>Private messaging is being prepared.</strong>Direct messages are not enabled in this foundation build. They will require conversation membership policies, age-aware message requests, and secure media permissions before launch.</div>`}
    init();
  })();
